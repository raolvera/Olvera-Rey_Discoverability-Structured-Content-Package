<?xml version="1.0" encoding="UTF-8"?>
<!--
  Favicon version of the Sun Devils Gameday Hub logo.
  Original line art by Rey Olvera (course project); generic trident.

  Unlike images/logo.svg (a transparent outline mark), this favicon sits on a
  solid maroon disc so the gold trident stays legible at tiny tab sizes
  (~16px) against a light browser tab bar. Colors match the site tokens:
  maroon #8c1d40, gold #ffc627. Vector, so it scales for high-DPI tabs.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"
     role="img" aria-label="Sun Devils Gameday Hub">
  <title>Sun Devils Gameday Hub</title>
  <!-- Maroon background disc, inset slightly to leave room for the ring -->
  <circle cx="16" cy="16" r="15" fill="#8c1d40"/>
  <!-- Gold ring around the disc -->
  <circle cx="16" cy="16" r="14.5" fill="none" stroke="#ffc627" stroke-width="2"/>
  <!-- Trident mark, drawn in gold. Coordinates are shifted/scaled to sit
       centered inside the 32x32 favicon. -->
  <g fill="none" stroke="#ffc627" stroke-width="2.4"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- Three triangle caps on the tine tips (filled for weight) -->
    <path d="M8 9 L12 9 L10 5 Z" fill="#ffc627" stroke="none"/>
    <path d="M14 8 L18 8 L16 4 Z" fill="#ffc627" stroke="none"/>
    <path d="M20 9 L24 9 L22 5 Z" fill="#ffc627" stroke="none"/>
    <!-- Three tines -->
    <path d="M10 9v5M16 8v6M22 9v5"/>
    <!-- Bowl curve joining the tines -->
    <path d="M10 14a6 6 0 0 0 12 0"/>
    <!-- Handle -->
    <path d="M16 14v11"/>
  </g>
</svg>
